services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pax
      POSTGRES_USER: pax
      POSTGRES_PASSWORD: pax
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # схема и демо-справочники накатываются при ПЕРВОМ старте пустого тома
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pax"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://pax:pax@postgres:5432/pax
      DATA_DIR: /data
    ports: ["8000:8000"]
    volumes:
      - ./data:/data          # сюда ML кладёт forecast/ и meta.json
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
